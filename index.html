        .modal-header-right { display: flex; gap: 12px; align-items: center; }

// ========== ГЕНЕРАЦИЯ ИКОНОК (БЕЛЫЙ ∞ НА ЧЁРНОМ ФОНЕ) ==========
function createIconDataURL(size) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const x = c.getContext('2d');
    x.fillStyle = "#03050a";
    x.fillRect(0, 0, size, size);
    x.font = `${size * 0.55}px 'Segoe UI', 'Montserrat', 'Times New Roman', serif`;
    x.textAlign = "center";
    x.textBaseline = "middle";
    x.fillStyle = "#FFFFFF";
    x.shadowBlur = size * 0.04;
    x.shadowColor = "rgba(255,255,200,0.6)";
    x.fillText("∞", size/2, size/2);
    x.shadowBlur = 0;
    return c.toDataURL('image/png');
}

// Устанавливаем favicon (64px)

function loadStations() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
        try {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        } catch(e) {}
    }
    return DEFAULT_STATIONS_COMPACT.map(item => {
        const [name, url, style] = item.split('|');
        return { name, url, style };
    });
}

function saveStations(stations) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(stations));
}

const importExcelBtn = document.getElementById('importExcelBtn');
const resetStationsBtn = document.getElementById('resetStationsBtn');

function importFromExcel(file) {
    const reader = new FileReader();
    reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
        if (!rows || rows.length < 2) {
            importStatus.textContent = 'Ошибка: файл пуст или неверный формат';
            setTimeout(() => { importStatus.textContent = ''; }, 3000);
            return;
        }
        const headers = rows[0];
        let nameCol = -1, urlCol = -1, styleCol = -1;
        for (let i = 0; i < headers.length; i++) {
            const h = String(headers[i]).toLowerCase();
            if (h.includes('station') || h.includes('name') || h === 'a') nameCol = i;
            if (h.includes('stream') || h.includes('link') || h === 'b') urlCol = i;
            if (h.includes('style') || h === 'c') styleCol = i;
        }
        if (nameCol === -1) nameCol = 0;
        if (urlCol === -1) urlCol = 1;
        if (styleCol === -1) styleCol = 2;
        
        const newStations = [];
        for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row.length < 3) continue;
            const name = row[nameCol] ? String(row[nameCol]).trim() : '';
            const url = row[urlCol] ? String(row[urlCol]).trim() : '';
            const style = row[styleCol] ? String(row[styleCol]).trim() : 'Другое';
            if (name && url && !newStations.some(s => s.name === name)) {
                let finalUrl = url;
                if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
                    finalUrl = 'http://' + finalUrl;
                }
                newStations.push({ name, url: finalUrl, style });
            }
        }
        if (newStations.length === 0) {
            importStatus.textContent = 'Не найдено станций в файле';
            setTimeout(() => { importStatus.textContent = ''; }, 3000);
            return;
        }
        stationsData = newStations;
        saveStations(stationsData);
        allStyles = [...new Set(stationsData.map(s => s.style))].sort();
        updateStyleFilter();
        renderList();
        importStatus.textContent = `✅ Импортировано ${newStations.length} станций!`;
        setTimeout(() => { importStatus.textContent = ''; }, 4000);
    };
    reader.readAsArrayBuffer(file);
}

function resetToDefaultStations() {
    stationsData = DEFAULT_STATIONS_COMPACT.map(item => {
        const [name, url, style] = item.split('|');
        return { name, url, style };
    });
    saveStations(stationsData);
    allStyles = [...new Set(stationsData.map(s => s.style))].sort();
    updateStyleFilter();
    renderList();
    importStatus.textContent = `✅ Сброшено к стандартному списку (${stationsData.length} станций)`;
    setTimeout(() => { importStatus.textContent = ''; }, 3000);
}

const copyrightEl = document.getElementById('copyrightText');

function onMusicPlay() { if (copyrightTimer) clearTimeout(copyrightTimer); copyrightTimer = setTimeout(() => copyrightEl.classList.add('hidden'), 500); }
function onMusicStop() { if (copyrightTimer) clearTimeout(copyrightTimer); copyrightTimer = setTimeout(() => copyrightEl.classList.remove('hidden'), 1000); }

function initAnalyser() {
    if (!audio.src) return;
    if (audioCtx && audioCtx.state !== 'closed') audioCtx.close();
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        audioCtx.createMediaElementSource(audio).connect(analyser);
        analyser.connect(audioCtx.destination);
        isAudioConnected = true;
        audioCtx.resume();
        let data = new Uint8Array(analyser.frequencyBinCount);
        function updateVol() {
            if (!analyser) return;
            analyser.getByteFrequencyData(data);
            let sum = 0; for (let i=0;i<data.length;i++) sum+=data[i];
            volume = ((sum/data.length)/255)*0.85 + volume*0.15;
            requestAnimationFrame(updateVol);
        }
        updateVol();
    } catch(e) {}
}
function playMusic() { audio.play().then(()=>{ if(!isAudioConnected) initAnalyser(); document.getElementById('autoplayHint').style.opacity='0'; onMusicPlay(); }).catch(()=>{ document.getElementById('autoplayHint').style.opacity='1'; }); }
function stopMusic() { audio.pause(); audio.currentTime=0; onMusicStop(); }
function setSource(url, name) { stopMusic(); audio.src=url; audio.load(); if(!isAudioConnected) initAnalyser(); playMusic(); }

let folderPlaylist = [], folderIndex = 0, isFolderMode = false;
function playNext() { if(!isFolderMode || !folderPlaylist.length) return; folderIndex = (folderIndex+1)%folderPlaylist.length; audio.src = folderPlaylist[folderIndex].file; audio.load(); audio.play().catch(e=>{}); if(!isAudioConnected) initAnalyser(); }
audio.addEventListener('ended', () => { if(isFolderMode) playNext(); });
function setFolder(files) {
    let list = [];
    for(let f of files) if(f.type.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|flac)$/i.test(f.name)) list.push({file: URL.createObjectURL(f), name: f.name});
    if(!list.length) return;
    if(isFolderMode) folderPlaylist.forEach(i=>URL.revokeObjectURL(i.file));
    folderPlaylist = list;
    folderIndex = 0;
    isFolderMode = true;
    stopMusic();
    audio.src = folderPlaylist[0].file;
    audio.load();
    if(!isAudioConnected) initAnalyser();
    audio.play().catch(e=>{});
}

function generateWordParticles() {
    let off = document.createElement('canvas'); off.width=W; off.height=H;
    let offCtx = off.getContext('2d');
    offCtx.fillStyle="#000"; offCtx.fillRect(0,0,W,H);
    let fs = Math.min(W*0.15,130); fs = Math.max(fs,56);
    offCtx.font = `bold ${fs}px 'Segoe UI', 'Montserrat', system-ui`;
    offCtx.textAlign="center"; offCtx.textBaseline="middle";
    offCtx.fillStyle="#fff";
    offCtx.fillText("ВЕЧНОСТЬ", W/2, H/2);
    offCtx.fillText("ВЕЧНОСТЬ", W/2, H/2);
    let img = offCtx.getImageData(0,0,W,H), data=img.data, pos=[];
    for(let y=0; y<H; y++) for(let x=0; x<W; x++) {
        if(data[(y*W+x)*4] > 200) pos.push({x,y});
    }
    if(pos.length>3500) { let step=pos.length/3500, lim=[]; for(let i=0;i<3500;i++) lim.push(pos[Math.floor(i*step)]); pos=lim; }
    let parts = [];
    for(let p of pos) {
        let color = ["#FFFFFF","#F8F9FA","#F0F2F5","#EAECEF","#E2E6EB"][Math.floor(Math.random()*5)];
        let radBase = 1.2+Math.random()*1.6;
        parts.push({ origX:p.x, origY:p.y, curX:p.x, curY:p.y, tarX:p.x, tarY:p.y, color, baseRad:radBase, rad:radBase, orbRad:0, orbAng:0, orbSpeed:0 });
    }
    return parts;
}

function updateOrbit(p) { let dx=p.tarX-Cx, dy=p.tarY-Cy; p.orbRad=Math.hypot(dx,dy); p.orbAng=Math.atan2(dy,dx); p.orbSpeed=0.14+(Math.random()-0.5)*0.1; if(p.orbSpeed<0.04) p.orbSpeed=0.07; }
function computeExplode() { for(let p of particles) { let ang=Math.random()*Math.PI*2, rad=140+Math.random()*180; let ox=Math.cos(ang)*rad, oy=Math.sin(ang)*rad; if(Math.random()>0.7){ox*=1.2;oy*=1.2;} let tx=p.origX+ox, ty=p.origY+oy; tx=Math.min(W+180,Math.max(-180,tx)); ty=Math.min(H+140,Math.max(-140,ty)); p.tarX=tx; p.tarY=ty; updateOrbit(p); } }
function getOrbit(p,t) { let ang=p.orbAng + p.orbSpeed*t; return { x:Cx+Math.cos(ang)*p.orbRad, y:Cy+Math.sin(ang)*p.orbRad }; }

function startCollect() { if(isCollecting) return; isCollecting = true; collectProgress = 0; collectStart = particles.map(p => ({ x: p.curX, y: p.curY })); isHover = false; isLeft = isRight = false; touchMode = null; }
function updateCollect(dt) { if(!isCollecting) return; collectProgress += dt*1.2; if(collectProgress>=1) { collectProgress=1; isCollecting=false; for(let p of particles) { p.curX=p.origX; p.curY=p.origY; } return; } let ease=1-Math.pow(1-collectProgress,2); for(let i=0;i<particles.length;i++) { let p=particles[i], s=collectStart[i]; p.curX = s.x + (p.origX - s.x)*ease; p.curY = s.y + (p.origY - s.y)*ease; } }

function applyForce(p, x, y, attract) {
    if(x===null) return {dx:0,dy:0};
    let dx=p.curX-x, dy=p.curY-y, dist=Math.hypot(dx,dy);
    if(dist<0.5) return {dx:0,dy:0};
    let base=2.2/(1+dist*0.018); if(base>0.85) base=0.85;
    let force=base*forceMult;
    let dirX, dirY;
    if(attract) { dirX=-dx; dirY=-dy; } else { dirX=dx; dirY=dy; }
    let len=Math.hypot(dirX,dirY); if(len>0.001) { dirX/=len; dirY/=len; }
    let stepX=dirX*force*(attract?2.2:2.8), stepY=dirY*force*(attract?2.2:2.8);
    let mag=Math.hypot(stepX,stepY), maxStep=attract?28:30;
    if(mag>maxStep) { stepX=stepX/mag*maxStep; stepY=stepY/mag*maxStep; }
    return {dx:stepX, dy:stepY};
}

function emitStars(now) {
    if(isCollecting) return;
    if(now - lastEmit < 3800) return;
    lastEmit = now;
    if(!particles.length) return;
    let count = 3 + Math.floor(Math.random() * 3);
    let indices = [];
    while(indices.length < count && indices.length < particles.length) {
        let i = Math.floor(Math.random() * particles.length);
        if(!indices.includes(i)) indices.push(i);
    }
    for(let i of indices) {
        let p = particles[i];
        let ang = Math.random() * Math.PI * 2;
        let dist = 45 + Math.random() * 55;
        let tx = p.curX + Math.cos(ang) * dist;
        let ty = p.curY + Math.sin(ang) * dist;
        flying.push({ startX: p.curX, startY: p.curY, targetX: tx, targetY: ty, progress: 0, speed: 0.008 + Math.random() * 0.006, isReturning: false, rad: p.rad * 1.2, color: p.color, origIdx: i });
    }
}

function updateFlying() {
    for(let i=0;i<flying.length;i++) {
        let f = flying[i];
        if(!f.isReturning) {
            f.progress += f.speed;
            if(f.progress >= 1) { f.isReturning = true; f.progress = 0; f.startX = f.curX; f.startY = f.curY; }
            else { let t = f.progress; f.curX = f.startX + (f.targetX - f.startX)*t; f.curY = f.startY + (f.targetY - f.startY)*t; }
        } else {
            f.progress += f.speed * 0.7;
            if(f.progress >= 1) { let p = particles[f.origIdx]; if(p) { f.curX = p.curX; f.curY = p.curY; } flying.splice(i,1); i--; continue; }
            else { let p = particles[f.origIdx]; if(p) { let tx = p.curX, ty = p.curY, t = f.progress; f.curX = f.startX + (tx - f.startX)*t; f.curY = f.startY + (ty - f.startY)*t; } else { flying.splice(i,1); i--; } }
        }
    }
}

function updatePositions(dt, nowSec) {
    if(isCollecting) { updateCollect(dt); return; }
    let bass = volume * 1.0;
    let vibX = (Math.random()-0.5)*bass*1.2, vibY = (Math.random()-0.5)*bass*1.2;
    glow = bass * 0.9;
    for(let p of particles) { let scale = 1 + bass*0.6; p.rad = p.baseRad * scale; if(p.rad > 3.5) p.rad = 3.5; }
    
    let attract = false, repel = false, cx = null, cy = null;
    if(touchMode && touchX!==null) { if(touchMode==='left') attract=true; else repel=true; cx=touchX; cy=touchY; }
    else if(isLeft) { attract=true; cx=mouseX; cy=mouseY; }
    else if(isRight) { repel=true; cx=mouseX; cy=mouseY; }
    
    if((attract||repel) && cx!==null && isHover) {
        for(let p of particles) { let f = applyForce(p, cx, cy, attract); let nx = p.curX + f.dx + vibX*0.6, ny = p.curY + f.dy + vibY*0.6; p.curX += (nx-p.curX)*0.85; p.curY += (ny-p.curY)*0.85; }
    } else if(isHover) {
        for(let p of particles) {
            let orb = getOrbit(p, globalTime);
            let dx = orb.x-Cx, dy = orb.y-Cy, distC = Math.hypot(dx,dy);
            if(distC>0.01) { let nx=dx/distC, ny=dy/distC, shift=bass*16; orb.x += nx*shift; orb.y += ny*shift; }
            orb.x += vibX*0.7; orb.y += vibY*0.7;
            let dxp = orb.x - p.curX, dyp = orb.y - p.curY;
            if(Math.abs(dxp)>0.3||Math.abs(dyp)>0.3) { p.curX += dxp*0.12; p.curY += dyp*0.12; } else { p.curX=orb.x; p.curY=orb.y; }
        }
    } else {
        for(let p of particles) {
            let tx = p.origX + vibX*0.8, ty = p.origY + vibY*0.8;
            let dx = tx-p.curX, dy = ty-p.curY;
            if(Math.abs(dx)>0.3||Math.abs(dy)>0.3) { p.curX += dx*0.12; p.curY += dy*0.12; } else { p.curX=tx; p.curY=ty; }
        }
    }
}

function draw() {
    ctx.fillStyle="#03050a"; ctx.fillRect(0,0,W,H);
    for(let p of particles) { ctx.beginPath(); ctx.arc(p.curX,p.curY,p.rad,0,Math.PI*2); ctx.fillStyle=p.color; ctx.fill(); }
    for(let f of flying) { ctx.beginPath(); ctx.arc(f.curX,f.curY,f.rad*1.1,0,Math.PI*2); ctx.fillStyle=f.color; ctx.fill(); ctx.beginPath(); ctx.arc(f.curX,f.curY,f.rad*0.7,0,Math.PI*2); ctx.fillStyle="#FFEECC"; ctx.fill(); }
    ctx.globalCompositeOperation="lighter";
    let r=255, g=200+Math.floor(glow*55), b=200+Math.floor(glow*55);
    if(glow>0.3) { g=160+Math.floor(glow*70); b=210+Math.floor(glow*45); }
    let glowColor = `rgba(${r},${g},${b},0.38)`;
    for(let p of particles) { ctx.beginPath(); ctx.arc(p.curX,p.curY,p.rad*1.8,0,Math.PI*2); ctx.fillStyle=glowColor; ctx.fill(); }
    ctx.globalCompositeOperation="source-over";
}

function animation(nowMs) {
    if(!lastTime) { lastTime=nowMs; requestAnimationFrame(animation); return; }
    let dt=Math.min(0.033,(nowMs-lastTime)/1000);
    if(dt<=0) { lastTime=nowMs; requestAnimationFrame(animation); return; }
    let any = isLeft || isRight || touchMode;
    if(any && isHover && (mouseX!==null||touchX!==null) && !isCollecting) { forceMult = Math.min(FORCE_MAX, forceMult + FORCE_ACC*dt); }
    else { forceMult = Math.max(0, forceMult - FORCE_DEC*dt); }
    if(!any && isHover && !isCollecting) globalTime += dt;
    lastTime=nowMs;
    updatePositions(dt, nowMs/1000);
    updateFlying();
    emitStars(nowMs);
    draw();
    animFrame = requestAnimationFrame(animation);
}

function onMouseEnter(e) { isHover = true; computeExplode(); updateMouse(e); }
function onMouseLeave() { isHover = false; isLeft = isRight = false; mouseX = mouseY = null; forceMult = 0; }
function onMouseMove(e) { if(isHover) updateMouse(e); }
function updateMouse(e) { let rect=canvas.getBoundingClientRect(); let sx=canvas.width/rect.width, sy=canvas.height/rect.height; mouseX=Math.min(W,Math.max(0,(e.clientX-rect.left)*sx)); mouseY=Math.min(H,Math.max(0,(e.clientY-rect.top)*sy)); }
function onMouseDown(e) { e.preventDefault(); if(e.button===0) { isLeft=true; isRight=false; } else if(e.button===2) { isRight=true; isLeft=false; } updateMouse(e); }
function onMouseUp(e) { if(e.button===0) isLeft=false; else if(e.button===2) isRight=false; }
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('mouseenter',onMouseEnter); canvas.addEventListener('mouseleave',onMouseLeave);
canvas.addEventListener('mousemove',onMouseMove); canvas.addEventListener('mousedown',onMouseDown);
window.addEventListener('mouseup',onMouseUp);

let lastTap = 0;
function onTouchStart(e) {
    e.preventDefault();
    const t = e.touches, now = Date.now();
    if(t.length===1) {
        if(now - lastTap < 300) { startCollect(); lastTap=0; return; }
        lastTap=now;
        if(!isHover) { isHover=true; computeExplode(); }
        touchMode = 'left';
        updateTouch(t[0]);
    } else if(t.length===2) {
        lastTap=0;
        if(!isHover) { isHover=true; computeExplode(); }
        touchMode = 'right';
        updateTouchCoords((t[0].clientX+t[1].clientX)/2, (t[0].clientY+t[1].clientY)/2);
    }
}
function onTouchMove(e) { e.preventDefault(); if(isCollecting) return; const t=e.touches; if(t.length===1 && touchMode==='left') updateTouch(t[0]); else if(t.length===2 && touchMode==='right') updateTouchCoords((t[0].clientX+t[1].clientX)/2, (t[0].clientY+t[1].clientY)/2); }
function onTouchEnd(e) { touchMode=null; touchX=touchY=null; }
function updateTouch(t) { let rect=canvas.getBoundingClientRect(); let sx=canvas.width/rect.width, sy=canvas.height/rect.height; touchX=Math.min(W,Math.max(0,(t.clientX-rect.left)*sx)); touchY=Math.min(H,Math.max(0,(t.clientY-rect.top)*sy)); mouseX=touchX; mouseY=touchY; }
function updateTouchCoords(x,y) { let rect=canvas.getBoundingClientRect(); let sx=canvas.width/rect.width, sy=canvas.height/rect.height; touchX=Math.min(W,Math.max(0,(x-rect.left)*sx)); touchY=Math.min(H,Math.max(0,(y-rect.top)*sy)); mouseX=touchX; mouseY=touchY; }
canvas.addEventListener('touchstart',onTouchStart,{passive:false}); canvas.addEventListener('touchmove',onTouchMove,{passive:false}); canvas.addEventListener('touchend',onTouchEnd); canvas.addEventListener('touchcancel',onTouchEnd);

function resize() { W=window.innerWidth; H=window.innerHeight; canvas.width=W; canvas.height=H; Cx=W/2; Cy=H/2; particles=generateWordParticles(); computeExplode(); for(let p of particles) updateOrbit(p); if(isHover) computeExplode(); isCollecting=false; isLeft=isRight=false; touchMode=null; forceMult=0; globalTime=0; lastTime=0; }
window.addEventListener('resize',resize);

const playBtn=document.getElementById('playBtn'), stopBtn=document.getElementById('stopBtn'), srcBtn=document.getElementById('sourceBtn');
const modal=document.getElementById('sourceModal'), closeModalBtn=document.getElementById('closeModalBtn'), applyTopBtn=document.getElementById('applyTopBtn');
const stationSearch=document.getElementById('stationSearch'), styleFilter=document.getElementById('styleFilter'), radioListDiv=document.getElementById('radioList');
const folderInput=document.getElementById('folderInput'), customUrl=document.getElementById('customUrlInput');

function renderList() {
    let search = stationSearch.value.toLowerCase();
    let style = styleFilter.value;
    let filt = stationsData.filter(s => (style === 'all' || s.style === style) && 
        (s.name.toLowerCase().includes(search) || s.style.toLowerCase().includes(search)));
    radioListDiv.innerHTML = '';
    for (let s of filt) {
        let div = document.createElement('div');
        div.className = 'radio-item';
        div.innerHTML = `<span class="radio-name">${s.name}</span><span class="radio-style">${s.style}</span>`;
        div.onclick = () => { setSource(s.url, s.name); closeModalF(); };
        radioListDiv.appendChild(div);
    }
}

function updateStyleFilter() {
    allStyles = [...new Set(stationsData.map(s => s.style))].sort();
    styleFilter.innerHTML = '<option value="all">все стили</option>';
    allStyles.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        styleFilter.appendChild(opt);
    });
}
updateStyleFilter();

stationSearch.addEventListener('input', renderList);
styleFilter.addEventListener('change', renderList);
folderInput.addEventListener('change', (e) => { if (e.target.files.length) setFolder(Array.from(e.target.files)); closeModalF(); });

function openModal() { modal.classList.add('active'); renderList(); }
function closeModalF() { modal.classList.remove('active'); }
function applyCustom() { let url = customUrl.value.trim(); if (url) setSource(url, url); closeModalF(); }

srcBtn.addEventListener('click', openModal);
closeModalBtn.addEventListener('click', closeModalF);
applyTopBtn.addEventListener('click', applyCustom);
modal.addEventListener('click', (e) => { if (e.target === modal) closeModalF(); });
playBtn.addEventListener('click', playMusic);
stopBtn.addEventListener('click', stopMusic);

function autoplay() {
    audio.play().then(() => {
        if (!isAudioConnected) initAnalyser();
        document.getElementById('autoplayHint').style.opacity = '0';
        onMusicPlay();
    }).catch(() => {
        document.getElementById('autoplayHint').style.opacity = '1';
        let start = () => {
            playMusic();
            canvas.removeEventListener('click', start);
            window.removeEventListener('touchstart', start);
        };
        canvas.addEventListener('click', start);
        window.addEventListener('touchstart', start);
    });
}

resize();
animFrame = requestAnimationFrame(animation);
autoplay();
</script>
</body>
